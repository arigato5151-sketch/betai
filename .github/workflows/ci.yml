name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  API_FOOTBALL_KEY: DEMO_KEY
  JWT_SECRET_KEY: ci-access-secret-that-is-not-used-in-production
  JWT_REFRESH_SECRET_KEY: ci-refresh-secret-that-is-not-used-in-production
  MODEL_SIGNING_KEY: ci-model-signing-secret-that-is-not-production
  ADMIN_USERNAME: ci-admin
  ADMIN_PASSWORD: ci-password-only-long-enough
  BOOTSTRAP_ADMIN_SECRET: ci-bootstrap-secret-that-is-long-enough

jobs:
  format-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Ruff
        run: python -m ruff check backend/app backend/migrations tests scripts fixture_resolver.py data_enricher.py data_pipeline.py
      - name: Black
        run: python -m black --check backend/app backend/migrations tests scripts fixture_resolver.py data_enricher.py data_pipeline.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Frontend lint
        run: npm --prefix frontend run lint

  unit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci_matches.db
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Type check (Mypy, typed domain boundary)
        run: python -m mypy backend/app
      - name: Alembic migration smoke test
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini check
      - name: Frontend unit + component tests
        run: npm --prefix frontend run test
      - name: Frontend production build
        run: npm --prefix frontend run build
      - name: Pytest (unit suite, SQLite)
        run: >-
          python -m pytest tests -q
          --cov=backend/app
          --cov-report=term-missing
          --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/0
      INTEGRATION_REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: PostgreSQL/Redis integration gate
        run: python -m pytest tests/integration -q -m integration

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: OpenAPI contract drift
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- docs/openapi.json

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Start production stack
        run: |
          docker compose up -d --build postgres redis memcached migration backend frontend bootstrap-admin
      - name: Wait for stack readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health/ready >/dev/null 2>&1 && curl -sf http://localhost:3000 >/dev/null 2>&1; then
              echo "stack ready"; exit 0
            fi
            sleep 5
          done
          echo "stack did not become ready"; docker compose ps; exit 1
      - name: Browser E2E (login, fixtures, analysis)
        run: npm --prefix frontend run e2e
      - name: Teardown
        if: always()
        run: docker compose down -v

  model-gates:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci_matches.db
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Tiered model tests & signed artifact
        run: |
          python -m pytest -q \
            tests/test_model_router.py \
            tests/test_multi_tier_ml_pipeline.py \
            tests/test_tiered_prediction_api.py \
            tests/test_train_tiered_models.py
          python scripts/check_tiered_artifact.py
      - name: Model leakage test (temporal hygiene gate)
        run: python -m pytest -q tests/test_leakage_gate.py
      - name: Walk-forward evaluation & promotion gate
        run: python scripts/walkforward_gate.py --synthetic
      - name: Resolver/enricher integration
        run: python -m pytest -q tests/test_resolver_enricher_integration.py tests/test_fixture_resolver.py tests/test_data_enricher.py tests/test_ingest_historical.py

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production images
        run: docker compose build backend frontend worker beat migration bootstrap-admin
      - name: Boot the stack
        run: docker compose up -d postgres redis memcached migration backend frontend bootstrap-admin
      - name: Docker smoke health checks
        run: |
          for i in $(seq 1 60); do
            backend_ready=$(curl -sf http://localhost:8000/health/ready || true)
            if [ -n "$backend_ready" ] && curl -sf http://localhost:3000 >/dev/null 2>&1; then
              echo "$backend_ready"
              echo "frontend OK"
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          echo "smoke failed"; docker compose ps; exit 1
      - name: Teardown
        if: always()
        run: docker compose down -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Secret leak guard
        run: python scripts/check_secrets.py
      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          ignore_args=()
          while IFS= read -r vulnerability; do
            [[ -z "$vulnerability" || "$vulnerability" == \#* ]] && continue
            ignore_args+=(--ignore-vuln "$vulnerability")
          done < .github/pip-audit-ignore.txt
          pip-audit \
            -r requirements.txt \
            -r requirements-dev.txt \
            "${ignore_args[@]}"
      - name: Frontend vulnerability audit
        run: npm --prefix frontend audit --audit-level=high
      - name: Static security scan (Bandit)
        run: python -m bandit -r backend/app -c .bandit.yml
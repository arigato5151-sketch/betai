services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: betai
      POSTGRES_PASSWORD: betai
      POSTGRES_DB: bet_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: memcached -m 64 -I 2m
    healthcheck:
      test: ["CMD-SHELL", "echo stats | nc 127.0.0.1 11211 | grep STAT"]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: alembic -c alembic.ini upgrade head
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://betai:betai@postgres:5432/bet_ai
      API_FOOTBALL_KEY: DEMO_KEY
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap-admin:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.cli.bootstrap_admin
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://betai:betai@postgres:5432/bet_ai
      API_FOOTBALL_KEY: DEMO_KEY
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-password}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.invalid}
    depends_on:
      migration:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://betai:betai@postgres:5432/bet_ai
      REDIS_URL: redis://redis:6379/0
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-DEMO_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-access-secret-change-me}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-development-refresh-secret-change-me}
      COOKIE_SECURE: "false"
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      FRONTEND_URL: http://localhost:3000
      BACKEND_CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - model_artifacts:/app/artifacts/models
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
      redis:
        condition: service_started
      memcached:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=INFO --concurrency=1
    healthcheck:
      disable: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://betai:betai@postgres:5432/bet_ai
      REDIS_URL: redis://redis:6379/0
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-DEMO_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-access-secret-change-me}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-development-refresh-secret-change-me}
      COOKIE_SECURE: "false"
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      FRONTEND_URL: http://localhost:3000
      BACKEND_CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - model_artifacts:/app/artifacts/models
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      memcached:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.tasks.celery_app:celery_app beat --loglevel=INFO --schedule=/var/run/celery/celerybeat-schedule
    healthcheck:
      disable: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://betai:betai@postgres:5432/bet_ai
      REDIS_URL: redis://redis:6379/0
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-DEMO_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-access-secret-change-me}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-development-refresh-secret-change-me}
      COOKIE_SECURE: "false"
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      FRONTEND_URL: http://localhost:3000
      BACKEND_CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - celery_beat_data:/var/run/celery
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  celery_beat_data:
  model_artifacts:

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: betai
      POSTGRES_PASSWORD: betai
      POSTGRES_DB: bet_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: memcached -m 64 -I 2m
    healthcheck:
      test: ["CMD-SHELL", "echo stats | nc 127.0.0.1 11211 | grep STAT"]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: alembic -c alembic.ini upgrade head
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://betai:betai@postgres:5432/bet_ai
      API_FOOTBALL_KEY: DEMO_KEY
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap-admin:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.cli.bootstrap_admin
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://betai:betai@postgres:5432/bet_ai
      API_FOOTBALL_KEY: DEMO_KEY
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-password}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.invalid}
    depends_on:
      migration:
        condition: service_completed_successfully

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://betai:betai@postgres:5432/bet_ai
      REDIS_URL: redis://redis:6379/0
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-DEMO_KEY}
      CLUBELO_ENABLED: ${CLUBELO_ENABLED:-true}
      CLUBELO_BASE_URL: ${CLUBELO_BASE_URL:-http://api.clubelo.com}
      CLUBELO_TIMEOUT_SECONDS: ${CLUBELO_TIMEOUT_SECONDS:-15}
      CLUBELO_CACHE_HOURS: ${CLUBELO_CACHE_HOURS:-24}
      CLUBELO_CONFIDENCE: ${CLUBELO_CONFIDENCE:-0.80}
      ODDS_SNAPSHOT_MIN_INTERVAL_SECONDS: ${ODDS_SNAPSHOT_MIN_INTERVAL_SECONDS:-300}
      ODDS_SNAPSHOT_CONFIDENCE: ${ODDS_SNAPSHOT_CONFIDENCE:-0.90}
      ODDS_COLLECTOR_ENABLED: ${ODDS_COLLECTOR_ENABLED:-true}
      ODDS_COLLECTOR_RUN_INTERVAL_SECONDS: ${ODDS_COLLECTOR_RUN_INTERVAL_SECONDS:-10800}
      ODDS_COLLECTOR_HORIZON_DAYS: ${ODDS_COLLECTOR_HORIZON_DAYS:-7}
      ODDS_COLLECTOR_MAX_FIXTURES: ${ODDS_COLLECTOR_MAX_FIXTURES:-20}
      ODDS_COLLECTOR_CLOSING_WINDOW_HOURS: ${ODDS_COLLECTOR_CLOSING_WINDOW_HOURS:-24}
      ODDS_COLLECTOR_CONCURRENCY: ${ODDS_COLLECTOR_CONCURRENCY:-2}
      LINEUP_COLLECTOR_ENABLED: ${LINEUP_COLLECTOR_ENABLED:-true}
      LINEUP_COLLECTOR_RUN_INTERVAL_SECONDS: ${LINEUP_COLLECTOR_RUN_INTERVAL_SECONDS:-3600}
      LINEUP_COLLECTOR_HORIZON_DAYS: ${LINEUP_COLLECTOR_HORIZON_DAYS:-2}
      LINEUP_COLLECTOR_MAX_FIXTURES: ${LINEUP_COLLECTOR_MAX_FIXTURES:-30}
      LINEUP_COLLECTOR_WINDOW_MINUTES: ${LINEUP_COLLECTOR_WINDOW_MINUTES:-120}
      LINEUP_COLLECTOR_CONCURRENCY: ${LINEUP_COLLECTOR_CONCURRENCY:-2}
      SPORTMONKS_ENABLED: ${SPORTMONKS_ENABLED:-false}
      SPORTMONKS_API_TOKEN: ${SPORTMONKS_API_TOKEN:-}
      SPORTMONKS_BASE_URL: ${SPORTMONKS_BASE_URL:-https://api.sportmonks.com/v3/football}
      SPORTMONKS_TIMEOUT_SECONDS: ${SPORTMONKS_TIMEOUT_SECONDS:-15}
      SPORTMONKS_PLAYER_LOOKBACK_DAYS: ${SPORTMONKS_PLAYER_LOOKBACK_DAYS:-120}
      SPORTMONKS_PLAYER_LOOKBACK_MATCHES: ${SPORTMONKS_PLAYER_LOOKBACK_MATCHES:-10}
      AUTO_TEAM_LOCATION_ENABLED: ${AUTO_TEAM_LOCATION_ENABLED:-true}
      GOAL_TIME_DECAY_FACTOR: ${GOAL_TIME_DECAY_FACTOR:-0.008}
      PLAYER_IMPACT_MIN_RATED_STARTERS: ${PLAYER_IMPACT_MIN_RATED_STARTERS:-7}
      PLAYER_IMPACT_LOOKBACK_MATCHES: ${PLAYER_IMPACT_LOOKBACK_MATCHES:-10}
      PLAYER_IMPACT_RATING_DECAY: ${PLAYER_IMPACT_RATING_DECAY:-0.85}
      PLAYER_IMPACT_REPLACEMENT_FACTOR: ${PLAYER_IMPACT_REPLACEMENT_FACTOR:-0.75}
      PLAYER_IMPACT_MIN_STRENGTH_RATIO: ${PLAYER_IMPACT_MIN_STRENGTH_RATIO:-0.70}
      PLAYER_IMPACT_MAX_STRENGTH_RATIO: ${PLAYER_IMPACT_MAX_STRENGTH_RATIO:-1.05}
      PLAYER_IMPACT_XG_ELASTICITY: ${PLAYER_IMPACT_XG_ELASTICITY:-1.0}
      PLAYER_IMPACT_MIN_XG_MULTIPLIER: ${PLAYER_IMPACT_MIN_XG_MULTIPLIER:-0.75}
      PLAYER_CRITICAL_ABSENCE_WEIGHT: ${PLAYER_CRITICAL_ABSENCE_WEIGHT:-0.25}
      PLAYER_QUESTIONABLE_ABSENCE_WEIGHT: ${PLAYER_QUESTIONABLE_ABSENCE_WEIGHT:-0.35}
      PLAYER_CONTEXT_SYNC_MAX_FIXTURES: ${PLAYER_CONTEXT_SYNC_MAX_FIXTURES:-20}
      PLAYER_CONTEXT_SYNC_CONCURRENCY: ${PLAYER_CONTEXT_SYNC_CONCURRENCY:-3}
      FATIGUE_LOOKBACK_DAYS: ${FATIGUE_LOOKBACK_DAYS:-14}
      FATIGUE_MATCH_REFERENCE_COUNT: ${FATIGUE_MATCH_REFERENCE_COUNT:-4}
      FATIGUE_IDEAL_REST_DAYS: ${FATIGUE_IDEAL_REST_DAYS:-7}
      FATIGUE_TRAVEL_REFERENCE_KM: ${FATIGUE_TRAVEL_REFERENCE_KM:-3000}
      FATIGUE_MATCH_WEIGHT: ${FATIGUE_MATCH_WEIGHT:-0.45}
      FATIGUE_REST_WEIGHT: ${FATIGUE_REST_WEIGHT:-0.40}
      FATIGUE_TRAVEL_WEIGHT: ${FATIGUE_TRAVEL_WEIGHT:-0.15}
      ENSEMBLE_BMA_MIN_LEAGUE_SAMPLES: ${ENSEMBLE_BMA_MIN_LEAGUE_SAMPLES:-30}
      ENSEMBLE_BMA_PRIOR_STRENGTH: ${ENSEMBLE_BMA_PRIOR_STRENGTH:-50}
      ENSEMBLE_BMA_HALF_LIFE_DAYS: ${ENSEMBLE_BMA_HALF_LIFE_DAYS:-180}
      ENSEMBLE_BMA_MIN_DATA_QUALITY_SCORE: ${ENSEMBLE_BMA_MIN_DATA_QUALITY_SCORE:-0}
      ENSEMBLE_BMA_MAX_BRIER_REGRESSION: ${ENSEMBLE_BMA_MAX_BRIER_REGRESSION:-0.005}
      ENSEMBLE_BMA_STATS_LOW_DATA_BOOST: ${ENSEMBLE_BMA_STATS_LOW_DATA_BOOST:-1.5}
      ENSEMBLE_BMA_ML_HIGH_QUALITY_BOOST: ${ENSEMBLE_BMA_ML_HIGH_QUALITY_BOOST:-1.5}
      ENABLE_CATBOOST_CANDIDATE: ${ENABLE_CATBOOST_CANDIDATE:-true}
      ENABLE_LIGHTGBM_CANDIDATE: ${ENABLE_LIGHTGBM_CANDIDATE:-true}
      ML_BOOSTER_TREES: ${ML_BOOSTER_TREES:-200}
      ML_BOOSTER_MAX_DEPTH: ${ML_BOOSTER_MAX_DEPTH:-6}
      ML_BOOSTER_LEARNING_RATE: ${ML_BOOSTER_LEARNING_RATE:-0.05}
      ML_BOOSTER_THREADS: ${ML_BOOSTER_THREADS:-2}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-access-secret-change-me}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-development-refresh-secret-change-me}
      MODEL_SIGNING_KEY: ${MODEL_SIGNING_KEY:-development-model-signing-key-change-me}
      COOKIE_SECURE: "false"
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      FRONTEND_URL: http://localhost:3000
      BACKEND_CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - model_artifacts:/app/artifacts/models
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
      redis:
        condition: service_started
      memcached:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=INFO --concurrency=1
    healthcheck:
      disable: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://betai:betai@postgres:5432/bet_ai
      REDIS_URL: redis://redis:6379/0
      MEMCACHED_HOST: memcached
      MEMCACHED_PORT: 11211
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-DEMO_KEY}
      ODDS_COLLECTOR_ENABLED: ${ODDS_COLLECTOR_ENABLED:-true}
      ODDS_COLLECTOR_RUN_INTERVAL_SECONDS: ${ODDS_COLLECTOR_RUN_INTERVAL_SECONDS:-10800}
      ODDS_COLLECTOR_HORIZON_DAYS: ${ODDS_COLLECTOR_HORIZON_DAYS:-7}
      ODDS_COLLECTOR_MAX_FIXTURES: ${ODDS_COLLECTOR_MAX_FIXTURES:-20}
      ODDS_COLLECTOR_CLOSING_WINDOW_HOURS: ${ODDS_COLLECTOR_CLOSING_WINDOW_HOURS:-24}
      ODDS_COLLECTOR_CONCURRENCY: ${ODDS_COLLECTOR_CONCURRENCY:-2}
      LINEUP_COLLECTOR_ENABLED: ${LINEUP_COLLECTOR_ENABLED:-true}
      LINEUP_COLLECTOR_RUN_INTERVAL_SECONDS: ${LINEUP_COLLECTOR_RUN_INTERVAL_SECONDS:-3600}
      LINEUP_COLLECTOR_HORIZON_DAYS: ${LINEUP_COLLECTOR_HORIZON_DAYS:-2}
      LINEUP_COLLECTOR_MAX_FIXTURES: ${LINEUP_COLLECTOR_MAX_FIXTURES:-30}
      LINEUP_COLLECTOR_WINDOW_MINUTES: ${LINEUP_COLLECTOR_WINDOW_MINUTES:-120}
      LINEUP_COLLECTOR_CONCURRENCY: ${LINEUP_COLLECTOR_CONCURRENCY:-2}
      SPORTMONKS_ENABLED: ${SPORTMONKS_ENABLED:-false}
      SPORTMONKS_API_TOKEN: ${SPORTMONKS_API_TOKEN:-}
      SPORTMONKS_BASE_URL: ${SPORTMONKS_BASE_URL:-https://api.sportmonks.com/v3/football}
      SPORTMONKS_TIMEOUT_SECONDS: ${SPORTMONKS_TIMEOUT_SECONDS:-15}
      SPORTMONKS_PLAYER_LOOKBACK_DAYS: ${SPORTMONKS_PLAYER_LOOKBACK_DAYS:-120}
      SPORTMONKS_PLAYER_LOOKBACK_MATCHES: ${SPORTMONKS_PLAYER_LOOKBACK_MATCHES:-10}
      GOAL_TIME_DECAY_FACTOR: ${GOAL_TIME_DECAY_FACTOR:-0.008}
      PLAYER_IMPACT_MIN_RATED_STARTERS: ${PLAYER_IMPACT_MIN_RATED_STARTERS:-7}
      PLAYER_IMPACT_LOOKBACK_MATCHES: ${PLAYER_IMPACT_LOOKBACK_MATCHES:-10}
      PLAYER_IMPACT_RATING_DECAY: ${PLAYER_IMPACT_RATING_DECAY:-0.85}
      PLAYER_IMPACT_REPLACEMENT_FACTOR: ${PLAYER_IMPACT_REPLACEMENT_FACTOR:-0.75}
      PLAYER_IMPACT_MIN_STRENGTH_RATIO: ${PLAYER_IMPACT_MIN_STRENGTH_RATIO:-0.70}
      PLAYER_IMPACT_MAX_STRENGTH_RATIO: ${PLAYER_IMPACT_MAX_STRENGTH_RATIO:-1.05}
      PLAYER_IMPACT_XG_ELASTICITY: ${PLAYER_IMPACT_XG_ELASTICITY:-1.0}
      PLAYER_IMPACT_MIN_XG_MULTIPLIER: ${PLAYER_IMPACT_MIN_XG_MULTIPLIER:-0.75}
      PLAYER_CRITICAL_ABSENCE_WEIGHT: ${PLAYER_CRITICAL_ABSENCE_WEIGHT:-0.25}
      PLAYER_QUESTIONABLE_ABSENCE_WEIGHT: ${PLAYER_QUESTIONABLE_ABSENCE_WEIGHT:-0.35}
      PLAYER_CONTEXT_SYNC_MAX_FIXTURES: ${PLAYER_CONTEXT_SYNC_MAX_FIXTURES:-20}
      PLAYER_CONTEXT_SYNC_CONCURRENCY: ${PLAYER_CONTEXT_SYNC_CONCURRENCY:-3}
      FATIGUE_LOOKBACK_DAYS: ${FATIGUE_LOOKBACK_DAYS:-14}
      FATIGUE_MATCH_REFERENCE_COUNT: ${FATIGUE_MATCH_REFERENCE_COUNT:-4}
      FATIGUE_IDEAL_REST_DAYS: ${FATIGUE_IDEAL_REST_DAYS:-7}
      FATIGUE_TRAVEL_REFERENCE_KM: ${FATIGUE_TRAVEL_REFERENCE_KM:-3000}
      FATIGUE_MATCH_WEIGHT: ${FATIGUE_MATCH_WEIGHT:-0.45}
      FATIGUE_REST_WEIGHT: ${FATIGUE_REST_WEIGHT:-0.40}
      FATIGUE_TRAVEL_WEIGHT: ${FATIGUE_TRAVEL_WEIGHT:-0.15}
      ENSEMBLE_BMA_MIN_LEAGUE_SAMPLES: ${ENSEMBLE_BMA_MIN_LEAGUE_SAMPLES:-30}
      ENSEMBLE_BMA_PRIOR_STRENGTH: ${ENSEMBLE_BMA_PRIOR_STRENGTH:-50}
      ENSEMBLE_BMA_HALF_LIFE_DAYS: ${ENSEMBLE_BMA_HALF_LIFE_DAYS:-180}
      ENSEMBLE_BMA_MIN_DATA_QUALITY_SCORE: ${ENSEMBLE_BMA_MIN_DATA_QUALITY_SCORE:-0}
      ENSEMBLE_BMA_MAX_BRIER_REGRESSION: ${ENSEMBLE_BMA_MAX_BRIER_REGRESSION:-0.005}
      ENSEMBLE_BMA_STATS_LOW_DATA_BOOST: ${ENSEMBLE_BMA_STATS_LOW_DATA_BOOST:-1.5}
      ENSEMBLE_BMA_ML_HIGH_QUALITY_BOOST: ${ENSEMBLE_BMA_ML_HIGH_QUALITY_BOOST:-1.5}
      ENABLE_CATBOOST_CANDIDATE: ${ENABLE_CATBOOST_CANDIDATE:-true}
      ENABLE_LIGHTGBM_CANDIDATE: ${ENABLE_LIGHTGBM_CANDIDATE:-true}
      ML_BOOSTER_TREES: ${ML_BOOSTER_TREES:-200}
      ML_BOOSTER_MAX_DEPTH: ${ML_BOOSTER_MAX_DEPTH:-6}
      ML_BOOSTER_LEARNING_RATE: ${ML_BOOSTER_LEARNING_RATE:-0.05}
      ML_BOOSTER_THREADS: ${ML_BOOSTER_THREADS:-2}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-access-secret-change-me}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-development-refresh-secret-change-me}
      MODEL_SIGNING_KEY: ${MODEL_SIGNING_KEY:-development-model-signing-key-change-me}
      COOKIE_SECURE: "false"
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      FRONTEND_URL: http://localhost:3000
      BACKEND_CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - model_artifacts:/app/artifacts/models
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      memcached:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.tasks.celery_app:celery_app beat --loglevel=INFO --schedule=/var/run/celery/celerybeat-schedule
    healthcheck:
      disable: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://betai:betai@postgres:5432/bet_ai
      REDIS_URL: redis://redis:6379/0
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-DEMO_KEY}
      ODDS_COLLECTOR_ENABLED: ${ODDS_COLLECTOR_ENABLED:-true}
      ODDS_COLLECTOR_RUN_INTERVAL_SECONDS: ${ODDS_COLLECTOR_RUN_INTERVAL_SECONDS:-10800}
      ODDS_COLLECTOR_HORIZON_DAYS: ${ODDS_COLLECTOR_HORIZON_DAYS:-7}
      ODDS_COLLECTOR_MAX_FIXTURES: ${ODDS_COLLECTOR_MAX_FIXTURES:-20}
      ODDS_COLLECTOR_CLOSING_WINDOW_HOURS: ${ODDS_COLLECTOR_CLOSING_WINDOW_HOURS:-24}
      ODDS_COLLECTOR_CONCURRENCY: ${ODDS_COLLECTOR_CONCURRENCY:-2}
      LINEUP_COLLECTOR_ENABLED: ${LINEUP_COLLECTOR_ENABLED:-true}
      LINEUP_COLLECTOR_RUN_INTERVAL_SECONDS: ${LINEUP_COLLECTOR_RUN_INTERVAL_SECONDS:-3600}
      LINEUP_COLLECTOR_HORIZON_DAYS: ${LINEUP_COLLECTOR_HORIZON_DAYS:-2}
      LINEUP_COLLECTOR_MAX_FIXTURES: ${LINEUP_COLLECTOR_MAX_FIXTURES:-30}
      LINEUP_COLLECTOR_WINDOW_MINUTES: ${LINEUP_COLLECTOR_WINDOW_MINUTES:-120}
      LINEUP_COLLECTOR_CONCURRENCY: ${LINEUP_COLLECTOR_CONCURRENCY:-2}
      SPORTMONKS_ENABLED: ${SPORTMONKS_ENABLED:-false}
      SPORTMONKS_API_TOKEN: ${SPORTMONKS_API_TOKEN:-}
      SPORTMONKS_BASE_URL: ${SPORTMONKS_BASE_URL:-https://api.sportmonks.com/v3/football}
      SPORTMONKS_TIMEOUT_SECONDS: ${SPORTMONKS_TIMEOUT_SECONDS:-15}
      SPORTMONKS_PLAYER_LOOKBACK_DAYS: ${SPORTMONKS_PLAYER_LOOKBACK_DAYS:-120}
      SPORTMONKS_PLAYER_LOOKBACK_MATCHES: ${SPORTMONKS_PLAYER_LOOKBACK_MATCHES:-10}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-access-secret-change-me}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:-development-refresh-secret-change-me}
      COOKIE_SECURE: "false"
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      FRONTEND_URL: http://localhost:3000
      BACKEND_CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - celery_beat_data:/var/run/celery
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  celery_beat_data:
  model_artifacts:

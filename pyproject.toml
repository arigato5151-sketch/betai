[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bet-ai-platform"
version = "0.1.0"
description = "Enterprise-grade AI betting analytics platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [ { name = "Bet AI Team" } ]
keywords = ["fastapi", "ml", "betting", "saas", "postgresql", "redis"]
dependencies = [
  "fastapi==0.139.0",
  "starlette==1.3.1",
  "uvicorn==0.28.0",
  "python-dotenv==1.2.2",
  "httpx==0.28.1",
  "sqlalchemy==2.0.28",
  "alembic==1.13.1",
  "psycopg2-binary==2.9.9",
  "redis==5.0.3",
  "cachetools==5.3.3",
  "aiomcache==0.8.2",
  "hvac==2.4.0",
  "azure-identity==1.25.3",
  "azure-keyvault-secrets==4.11.0",
  "celery==5.3.6",
  "joblib==1.3.2",
  "pandas==2.2.1",
  "numpy==1.26.4",
  "scikit-learn==1.5.2",
  "shap==0.45.0",
  "pydantic-settings==2.14.2",
  "PyJWT[crypto]==2.13.0",
  "bcrypt==5.0.0",
  "scipy==1.11.3"
]
scripts = { start = "python run.py", check = "python run.py --check" }

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-cov==5.0.0",
  "pytest-asyncio==1.4.0",
  "httpx2==2.5.0",
  "types-cachetools==5.3.0.7",
  "black==26.3.1",
  "ruff==0.4.10",
  "mypy==1.8.0",
  "pre-commit==4.5.0",
  "colorama==0.4.6"
]

[tool.black]
target-version = ["py311", "py312"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.report]
fail_under = 73
show_missing = true

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*"]
ignore_missing_imports = true
